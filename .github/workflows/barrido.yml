name: barrido

on:
  # GitHub no garantiza los cron: en las horas en punto / y media se retrasan o se pierden.
  # Por eso minutos "raros" y dos respaldos; el job `revisar` hace que los respaldos
  # no hagan nada si ya hubo corrida hoy (así no se vacía nuevas.json).
  schedule:
    - cron: "17 10 * * *"   # 5:17 a. m. hora Colombia (principal)
    - cron: "43 11 * * *"   # 6:43 a. m. (respaldo)
    - cron: "7 13 * * *"    # 8:07 a. m. (último respaldo, antes de que lo lea el agente)
  workflow_dispatch:
    inputs:
      solo:
        description: "Fuentes a correr, separadas por coma (vacío = todas)"
        required: false
        default: ""
      depurar:
        description: "Guardar HTML crudo de cada fuente en debug/"
        type: boolean
        default: false
      automatico:
        description: "Llamada automática (cron-job.org): no corre si ya hubo corrida hoy"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: barrido-${{ github.ref }}
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    outputs:
      correr: ${{ steps.hoy.outputs.correr }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data
      - id: hoy
        run: |
          hoy=$(TZ=America/Bogota date +%Y-%m-%d)
          hora=$(TZ=America/Bogota date +%H)
          ultima=$(python3 -c "import json;print(json.load(open('data/estado.json')).get('ultima_corrida',''))" 2>/dev/null || true)
          automatica=false
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.automatico }}" = "true" ]; then automatica=true; fi
          if [ "$automatica" = "true" ] && [ "${ultima:0:10}" = "$hoy" ]; then
            echo "Ya hubo corrida hoy ($ultima): esta llamada automática no hace nada."
            echo "correr=false" >> "$GITHUB_OUTPUT"
          else
            if [ "$automatica" = "true" ] && [ "${ultima:0:10}" != "$hoy" ] && [ "$hora" = "08" ]; then
              echo "Alerta: cron-job.org falló (¿token vencido?). Esta es la corrida de respaldo." > data/alerta.txt
            else
              rm -f data/alerta.txt
            fi
            echo "Última corrida: ${ultima:-ninguna}. Corro."
            echo "correr=true" >> "$GITHUB_OUTPUT"
          fi

  barrido:
    needs: revisar
    if: needs.revisar.outputs.correr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests del filtro
        run: python -m pytest -q tests
      - name: Barrido
        env:
          SNAPSHOT_DIR: ${{ inputs.depurar && 'debug' || '' }}
        run: python robot/barrido.py ${{ inputs.solo && format('--solo {0}', inputs.solo) || '' }}
      - name: Resumen
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          e = json.load(open("data/estado.json"))
          print(f"### Barrido {e['ultima_corrida']} — {e['total_nuevas']} nuevas (inicial: {e['corrida_inicial']})")
          print("| fuente | estado | leídos | filtradas | nuevas | s | error |\n|---|---|---|---|---|---|---|")
          for n, f in e["fuentes"].items():
              print(f"| {n} | {f['estado']} | {f['listados']} | {f['candidatas']} | {f['nuevas']} | {f['duracion_s']} | {f['error'][:120]} |")
          PY
          cat data/estado.json
      - name: Commit de resultados
        run: |
          git config user.name "robot-vacantes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          [ -d debug ] && git add -f debug || true
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Barrido $(TZ=America/Bogota date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1

  pages:
    needs: barrido
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
